name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: CLI regression tests
        run: npm run test:regression
      - name: Demo runs the current engine and database
        run: |
          node scripts/build-demo.mjs
          git diff --exit-code -- demo/lib

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - name: Install the packed tarball like a user would
        run: |
          npm pack
          npm install -g ./slop-radar-*.tgz
      - name: Test the installed CLI
        run: |
          slop-radar --version
          echo "Let me dive deep into this transformative journey" | slop-radar check
          score=$(echo "Let me dive deep into this transformative journey" | slop-radar score | sed 's/\x1b\[[0-9;]*m//g' | awk '{print $1}')
          echo "score=$score"
          test "$score" -lt 100
