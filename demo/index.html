<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slop Radar - AI Text Detector</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:system-ui,-apple-system,sans-serif;line-height:1.6}
.header{text-align:center;padding:2rem 1rem;border-bottom:1px solid #21262d}
.header h1{font-size:1.8rem;color:#f0883e}
.header p{color:#8b949e;margin-top:.3rem}
.container{max-width:900px;margin:0 auto;padding:1.5rem 1rem}
textarea{width:100%;height:200px;padding:1rem;font-size:.95rem;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;resize:vertical;font-family:inherit;line-height:1.7}
textarea:focus{outline:none;border-color:#f0883e}
.actions{display:flex;gap:.5rem;margin:1rem 0;flex-wrap:wrap;align-items:center}
.btn{padding:.6rem 1.2rem;background:#f0883e;border:none;border-radius:6px;color:#0d1117;font-size:.95rem;font-weight:700;cursor:pointer}
.btn:hover{background:#d2762e}
.ex-btn{padding:.4rem .8rem;font-size:.8rem;background:#161b22;border:1px solid #30363d;border-radius:4px;color:#8b949e;cursor:pointer}
.ex-btn:hover{border-color:#f0883e;color:#f0883e}
.lang-toggle{margin-left:auto;display:flex;gap:.3rem}
.lang-btn{padding:.4rem .6rem;font-size:.8rem;background:#161b22;border:1px solid #30363d;border-radius:4px;color:#8b949e;cursor:pointer}
.lang-btn.active{background:#f0883e33;border-color:#f0883e;color:#f0883e}
.results{margin-top:1.5rem}
.score-card{display:flex;align-items:center;gap:1.5rem;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.score-num{font-size:3rem;font-weight:800;min-width:100px;text-align:center}
.score-info{flex:1}
.badge{display:inline-block;padding:.3rem .8rem;border-radius:20px;font-weight:700;font-size:.85rem}
.score-desc{color:#8b949e;margin-top:.3rem;font-size:.9rem}
.found-section{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:1rem;margin-bottom:1rem}
.found-section h3{color:#f0883e;font-size:.95rem;margin-bottom:.8rem}
.highlight-text{font-size:.9rem;line-height:2;white-space:pre-wrap;word-wrap:break-word}
.highlight-text mark{background:#da363355;color:#f85149;border-radius:2px;padding:0 2px;text-decoration:underline wavy #f85149}
.phrase-list{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.8rem}
.phrase-tag{font-size:.75rem;padding:.2rem .5rem;background:#da363322;border:1px solid #da363355;border-radius:4px;color:#f85149}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:1rem}
.stat{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:.8rem;text-align:center}
.stat-num{font-size:1.5rem;font-weight:700}
.stat-label{font-size:.75rem;color:#8b949e}
.empty{text-align:center;padding:3rem;color:#484f58}
.footer{text-align:center;padding:2rem;border-top:1px solid #21262d;margin-top:2rem;color:#8b949e;font-size:.85rem}
.footer a{color:#58a6ff;text-decoration:none}
@media(max-width:600px){.score-card{flex-direction:column;text-align:center}.stats{grid-template-columns:1fr}.header h1{font-size:1.3rem}}
</style>
</head>
<body>
<div class="header">
<h1>Slop Radar</h1>
<p>Detect AI-style writing by its phrases and structure &mdash; <span id="counts">English + German phrase database</span></p>
</div>
<div class="container">
<textarea id="input" placeholder="Paste your text here to analyze for AI slop patterns..."></textarea>
<div class="actions">
<button class="btn" id="analyze">Analyze</button>
<button class="ex-btn" id="try-ai">Try AI-generated text</button>
<button class="ex-btn" id="try-human">Try human text</button>
<button class="ex-btn" id="try-de">Try German AI text</button>
<div class="lang-toggle">
<button class="lang-btn active" data-lang="auto">Auto</button>
<button class="lang-btn" data-lang="en">EN</button>
<button class="lang-btn" data-lang="de">DE</button>
</div>
</div>
<div class="results" id="results">
<div class="empty">Paste text and click Analyze to detect AI slop patterns.</div>
</div>
</div>
<div class="footer">
Same engine and database as the <a href="https://github.com/renefichtmueller/slop-radar">slop-radar</a> CLI &middot; Open Source &middot; MIT License &middot; <a href="https://github.com/renefichtmueller/slop-radar">GitHub</a>
</div>
<script type="module">
import db from "./lib/database.js";
import { detectWith } from "./lib/engine.js";
import { score as scoreDetection, scoredCount } from "./lib/scorer.js";

const EXAMPLES = {
  "try-ai": `In today's fast-paced world, it's crucial to leverage cutting-edge solutions that seamlessly integrate with existing workflows. This comprehensive guide delves into the transformative power of innovative approaches that are truly game-changing.

Moreover, it's worth noting that these robust frameworks empower stakeholders to unlock unprecedented value. The holistic approach fosters synergy across the ecosystem, paving the way for groundbreaking results.

In conclusion, by harnessing these best-in-class methodologies, organizations can navigate the complexities of the ever-evolving landscape and move the needle on mission-critical objectives.`,
  "try-human": `We switched our database from MySQL to PostgreSQL last week. The migration took about 3 days, mostly because of the JSON column differences. Had to rewrite 12 queries that used MySQL-specific syntax.

The biggest pain point was the GROUP_CONCAT function - PostgreSQL uses string_agg instead. Also, our TIMESTAMP columns needed explicit timezone handling.

Performance improved by roughly 20% on our heaviest queries after adding proper indexes. The EXPLAIN output in PostgreSQL is way more detailed than MySQL, which helped a lot with optimization.`,
  "try-de": `In der heutigen schnelllebigen Welt ist es wichtig zu beachten, dass maßgeschneiderte Lösungen einen echten Mehrwert schaffen. Tauchen wir ein: Dieser ganzheitliche Ansatz spielt eine entscheidende Rolle und hebt Ihr Unternehmen auf das nächste Level.

Zusammenfassend lässt sich sagen, dass nahtlose Integration das volle Potenzial entfaltet.`,
};

const RATING_COLORS = {
  "HUMAN": "#3fb950",
  "MOSTLY CLEAN": "#3fb950",
  "SUSPICIOUS": "#d29922",
  "LIKELY AI": "#f0883e",
  "PURE SLOP": "#f85149",
};

let lang = "auto";
const $ = (id) => document.getElementById(id);

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// Builds the highlighted text from match spans, escaping every slice, so
// pasted markup is shown as text and never interpreted.
function highlight(text, phraseMatches) {
  const spans = phraseMatches
    .flatMap((m) => m.positions.map((start, i) => [start, start + m.lengths[i]]))
    .sort((a, b) => a[0] - b[0]);
  let html = "";
  let cursor = 0;
  for (const [start, end] of spans) {
    html += escapeHtml(text.slice(cursor, start)) + `<mark>${escapeHtml(text.slice(start, end))}</mark>`;
    cursor = end;
  }
  return html + escapeHtml(text.slice(cursor));
}

function tag(label) {
  return `<span class="phrase-tag">${escapeHtml(label)}</span>`;
}

function patternTag(pm) {
  const counted = scoredCount(pm);
  const times = pm.count > 1 ? ` ×${pm.count}` : "";
  const cap = counted < pm.count ? ` (counted ${counted}×)` : "";
  return `<span class="phrase-tag" title="${escapeHtml(pm.description)}">${escapeHtml(pm.name + times + cap)}</span>`;
}

function render(text, detection, result) {
  const color = RATING_COLORS[result.rating];
  const words = text.split(/\s+/).filter(Boolean).length;
  const language = detection.language === "de" ? "German" : "English";
  const phrases = detection.phraseMatches.map((m) => tag(m.count > 1 ? `${m.phrase} ×${m.count}` : m.phrase));
  $("results").innerHTML = `
    <div class="score-card">
      <div class="score-num" style="color:${color}">${result.score}</div>
      <div class="score-info">
        <span class="badge" style="background:${color}22;color:${color}">${result.rating}</span>
        <div class="score-desc">Score out of 100 (higher is more human) &middot; ${language} &middot; ${words} words</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-num" style="color:${color}">${detection.totalPhraseHits}</div><div class="stat-label">Buzzword hits (-2 each)</div></div>
      <div class="stat"><div class="stat-num" style="color:${color}">${detection.totalPatternHits}</div><div class="stat-label">Structural pattern hits</div></div>
      <div class="stat"><div class="stat-num">${words}</div><div class="stat-label">Words</div></div>
    </div>
    ${phrases.length ? `<div class="found-section"><h3>Highlighted Text</h3><div class="highlight-text">${highlight(text, detection.phraseMatches)}</div>
      <div class="phrase-list">${phrases.join("")}</div></div>` : ""}
    ${detection.patternMatches.length ? `<div class="found-section"><h3>Structural Patterns</h3><div class="phrase-list">${detection.patternMatches.map(patternTag).join("")}</div></div>` : ""}`;
}

function analyze() {
  const text = $("input").value;
  if (!text.trim()) {
    $("results").innerHTML = '<div class="empty">Enter some text first.</div>';
    return;
  }
  const detection = detectWith(db, text, lang);
  render(text, detection, scoreDetection(detection));
}

function setLang(next) {
  lang = next;
  document.querySelectorAll(".lang-btn").forEach((b) => b.classList.toggle("active", b.dataset.lang === next));
}

$("counts").textContent = `${db.phrasesEn.length} EN + ${db.phrasesDe.length} DE phrases, ${db.patterns.length} patterns`;
$("analyze").addEventListener("click", analyze);
for (const id of Object.keys(EXAMPLES)) {
  $(id).addEventListener("click", () => {
    $("input").value = EXAMPLES[id];
    analyze();
  });
}
document.querySelectorAll(".lang-btn").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
</script>
</body>
</html>
